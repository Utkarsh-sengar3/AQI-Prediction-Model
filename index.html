</head>

<body>

<h1>🌍 AQI Prediction Dashboard</h1>

<input id="city" placeholder="Enter city name">
<button onclick="predict()">Predict</button>

<h2 id="location"></h2>

<canvas id="chart" width="700" height="300"></canvas>

<div id="predictions"></div>

<script>
let chart;

async function predict() {

    const city = document.getElementById("city").value;

    const res = await fetch("/api/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({city})
    });

    const data = await res.json();

    document.getElementById("location").innerText =
        data.city + ", " + data.country;

    // Graph data
    const labels = data.history.map(x => x.date);
    const values = data.history.map(x => x.aqi);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: "AQI Trend",
                data: values
            }]
        }
    });

    // Predictions
    let html = "<h2>5-Day Prediction</h2>";

    data.predictions.forEach(p => {
        html += `
        <div class="card">
            Day ${p.day}<br>
            <b>${p.aqi}</b><br>
            ${p.category}
        </div>`;
    });

    document.getElementById("predictions").innerHTML = html;
}
</script>

</body>
</html>
